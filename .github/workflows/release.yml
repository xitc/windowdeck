name: Release

on:
  schedule:
    - cron: '17 4 * * *'
      timezone: Asia/Shanghai
  workflow_dispatch:
    inputs:
      channel:
        description: 'nightly = 每日测试版；version = manifest 指定的 Beta/正式版'
        type: choice
        options: [nightly, version]
        default: nightly

permissions:
  contents: write

concurrency:
  group: windowdeck-release
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Release workflow tests
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v

      - name: Plan release before SDK setup
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_CHANNEL: ${{ inputs.channel || 'nightly' }}
        run: |
          set -euo pipefail
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/releases" > "$RUNNER_TEMP/releases.json"
          python3 tools/prepare_release.py --mode "$RELEASE_CHANNEL" \
            --releases "$RUNNER_TEMP/releases.json" --output-dir "$RUNNER_TEMP/release-plan" --apply

      - name: Set up JDK 17
        if: steps.plan.outputs.publish == 'true'
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        if: steps.plan.outputs.publish == 'true'
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: platforms;android-35 build-tools;35.0.0
          log-accepted-android-sdk-licenses: false

      - name: Fetch Xposed API 82
        if: steps.plan.outputs.publish == 'true'
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/xposed"
          curl -fsSL -o "$RUNNER_TEMP/xposed/api-82.jar" \
            https://raw.githubusercontent.com/rovo89/XposedBridge/gh-pages/de/robv/android/xposed/api/82/api-82.jar
          echo "f48c635f1c7469fdec0e00ad2ea0b7a6b2f5b55065784a35b7ca3a84615e8e25  $RUNNER_TEMP/xposed/api-82.jar" | sha256sum -c
          echo "XPOSED_API=$RUNNER_TEMP/xposed/api-82.jar" >> "$GITHUB_ENV"

      - name: Layout tests
        if: steps.plan.outputs.publish == 'true'
        run: sh tools/test_layout.sh

      - name: Restore release keystore
        if: steps.plan.outputs.publish == 'true'
        env:
          WINDOWDECK_KEYSTORE_BASE64: ${{ secrets.WINDOWDECK_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "${WINDOWDECK_KEYSTORE_BASE64}" ]; then
            printf '%s\n' 'Missing secret WINDOWDECK_KEYSTORE_BASE64' >&2
            exit 1
          fi
          umask 077
          mkdir -p build
          printf '%s' "$WINDOWDECK_KEYSTORE_BASE64" | base64 -d > build/windowdeck-test.keystore
          fp=$(keytool -list -v -keystore build/windowdeck-test.keystore -storepass android -alias windowdeck \
            | sed -n 's/^[[:space:]]*SHA256: //p' | tr -d ':' | tr 'A-F' 'a-f')
          expected=a9b3625015d7023dd3e979e871e93a33f83cfcaa7090664348d01a8a23c572ae
          if [ "$fp" != "$expected" ]; then
            printf '%s\n' "Release keystore certificate is ${fp:-missing}" >&2
            exit 1
          fi

      - name: Build
        if: steps.plan.outputs.publish == 'true'
        run: sh tools/build_module.sh

      - name: Check APK identity and signed certificate
        if: steps.plan.outputs.publish == 'true'
        run: |
          set -euo pipefail
          sdk="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          version=$(sed -n 's/.*android:versionName="\([^"]*\)".*/\1/p' module/AndroidManifest.xml)
          apk="build/windowdeck/windowdeck-v${version}.apk"
          identity=$("$sdk/build-tools/35.0.0/aapt" dump badging "$apk" | sed -n '1p')
          [[ "$identity" == *"name='io.github.xitc.windowdeck'"* ]]
          [[ "$identity" == *"versionCode='${{ steps.plan.outputs.code }}'"* ]]
          [[ "$identity" == *"versionName='$version'"* ]]
          "$sdk/build-tools/35.0.0/apksigner" verify --print-certs "$apk" \
            | grep a9b3625015d7023dd3e979e871e93a33f83cfcaa7090664348d01a8a23c572ae > /dev/null

      - name: Publish release
        if: steps.plan.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.plan.outputs.tag }}
          RELEASE_VERSION: ${{ steps.plan.outputs.version }}
          RELEASE_TITLE: ${{ steps.plan.outputs.title }}
          RELEASE_PRERELEASE: ${{ steps.plan.outputs.prerelease }}
        run: |
          set -euo pipefail
          stage="$RUNNER_TEMP/release-assets"
          mkdir -p "$stage"
          cp "build/windowdeck/windowdeck-v${RELEASE_VERSION}.apk" "$stage/"
          cp "$RUNNER_TEMP/release-plan/BUILD_INFO.json" "$stage/"
          (
            cd "$stage"
            sha256sum "windowdeck-v${RELEASE_VERSION}.apk" BUILD_INFO.json > SHA256SUMS
          )
          release_args=()
          if [ "$RELEASE_PRERELEASE" = true ]; then
            release_args+=(--prerelease)
          fi
          # Keep incomplete uploads in a draft; publish only after all assets exist.
          # A failed attempt can resume its draft, but never alter a published release.
          existing=$(gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/releases" \
            | jq --arg tag "$RELEASE_TAG" -r 'add | .[] | select(.tag_name == $tag) | .draft')
          if [ "$existing" = false ]; then
            echo 'Release already published; skipping.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          elif [ "$existing" = true ]; then
            gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
              --title "$RELEASE_TITLE" --notes-file "$RUNNER_TEMP/release-plan/notes.md" \
              "${release_args[@]}"
            gh release upload "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --clobber \
              "$stage/windowdeck-v${RELEASE_VERSION}.apk" "$stage/SHA256SUMS" "$stage/BUILD_INFO.json"
          else
            gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" --title "$RELEASE_TITLE" --draft \
              --notes-file "$RUNNER_TEMP/release-plan/notes.md" "${release_args[@]}" \
              "$stage/windowdeck-v${RELEASE_VERSION}.apk" "$stage/SHA256SUMS" "$stage/BUILD_INFO.json"
          fi
          latest_args=(--latest=false)
          if [ "$RELEASE_PRERELEASE" != true ]; then
            latest_args=(--latest)
          fi
          gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false "${latest_args[@]}"
          echo "Published [$RELEASE_TAG](https://github.com/$GITHUB_REPOSITORY/releases/tag/$RELEASE_TAG)" >> "$GITHUB_STEP_SUMMARY"

      - name: Remove release keystore
        if: always()
        run: rm -f build/windowdeck-test.keystore
