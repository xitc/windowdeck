name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: platforms;android-35 build-tools;35.0.0
          log-accepted-android-sdk-licenses: false

      - name: Fetch Xposed API 82
        run: |
          set -eu
          mkdir -p "$RUNNER_TEMP/xposed"
          curl -fsSL -o "$RUNNER_TEMP/xposed/api-82.jar" \
            https://raw.githubusercontent.com/rovo89/XposedBridge/gh-pages/de/robv/android/xposed/api/82/api-82.jar
          echo "f48c635f1c7469fdec0e00ad2ea0b7a6b2f5b55065784a35b7ca3a84615e8e25  $RUNNER_TEMP/xposed/api-82.jar" | sha256sum -c
          echo "XPOSED_API=$RUNNER_TEMP/xposed/api-82.jar" >> "$GITHUB_ENV"

      - name: Layout tests
        run: sh tools/test_layout.sh

      - name: Restore release keystore
        env:
          WINDOWDECK_KEYSTORE_BASE64: ${{ secrets.WINDOWDECK_KEYSTORE_BASE64 }}
        run: |
          set -eu
          if [ -z "${WINDOWDECK_KEYSTORE_BASE64}" ]; then
            printf '%s\n' 'Missing secret WINDOWDECK_KEYSTORE_BASE64' >&2
            exit 1
          fi
          umask 077
          mkdir -p build
          printf '%s' "$WINDOWDECK_KEYSTORE_BASE64" | base64 -d > build/windowdeck-test.keystore
          fp=$(keytool -list -v -keystore build/windowdeck-test.keystore -storepass android -alias windowdeck \
            | sed -n 's/^[[:space:]]*SHA256: //p' | head -n 1 | tr -d ':' | tr 'A-F' 'a-f')
          expected=a9b3625015d7023dd3e979e871e93a33f83cfcaa7090664348d01a8a23c572ae
          if [ "$fp" != "$expected" ]; then
            printf '%s\n' "Release keystore certificate is ${fp:-missing}" >&2
            exit 1
          fi

      - name: Build
        run: sh tools/build_module.sh

      - name: Check signed APK certificate
        run: |
          set -eu
          sdk="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          version=$(sed -n 's/.*android:versionName="\([^"]*\)".*/\1/p' module/AndroidManifest.xml)
          apk="build/windowdeck/windowdeck-v${version}.apk"
          "$sdk/build-tools/35.0.0/apksigner" verify --print-certs "$apk" \
            | grep -q a9b3625015d7023dd3e979e871e93a33f83cfcaa7090664348d01a8a23c572ae

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          version=$(sed -n 's/.*android:versionName="\([^"]*\)".*/\1/p' module/AndroidManifest.xml)
          code=$(sed -n 's/.*android:versionCode="\([^"]*\)".*/\1/p' module/AndroidManifest.xml)
          case "$version" in
            ''|*[!a-zA-Z0-9.-]*) printf '%s\n' 'Invalid APK version' >&2; exit 1;;
          esac
          tag="v${version}"
          apk="build/windowdeck/windowdeck-v${version}.apk"
          test -f "$apk"

          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::warning title=release skipped::${tag} already exists. This build was signed and verified, and no release was published."
            exit 0
          fi

          section=$(awk -v heading="## ${tag}" '
            $0 == heading { found=1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md)
          trimmed=$(printf '%s\n' "$section" | sed '/^[[:space:]]*$/d')
          if [ -z "$trimmed" ]; then
            printf '%s\n' "CHANGELOG.md has no notes under ## ${tag}" >&2
            exit 1
          fi

          stage="$RUNNER_TEMP/release-assets"
          mkdir -p "$stage"
          cp "$apk" "$stage/windowdeck-v${version}.apk"
          (
            cd "$stage"
            sha256sum "windowdeck-v${version}.apk" > SHA256SUMS
          )

          release_args=()
          title="WindowDeck ${tag}"
          lead="**${tag}**"
          case "$version" in
            *beta*)
              release_args+=(--prerelease)
              title="WindowDeck ${tag} · Beta 测试版"
              lead="**${tag} 是测试版本，不是稳定版。**"
              ;;
            *alpha*|*rc*|*dev*)
              release_args+=(--prerelease)
              lead="**${tag} 是测试版本，不是稳定版。**"
              ;;
          esac

          notes="$RUNNER_TEMP/notes.md"
          {
            printf '%s\n' "## 多窗工作台 · WindowDeck" "" "$lead" "" \
              "- 应用名称：多窗工作台" \
              "- 包名：\`dev.windowdeck.app\`" \
              "- 版本：\`${version}\` / versionCode ${code}" \
              "- 下载附件中的 APK；\`SHA256SUMS\` 提供 SHA-256 校验值。" \
              "- 签名与已发布的 GitHub 版本相同，可覆盖安装上一版。" \
              "" "### 本版变化" ""
            printf '%s\n' "$section"
            printf '%s\n' "" "### 安装" "" \
              "需要 Root 与 LSPosed。启用「多窗工作台」，作用域选择 \`com.oplus.pscanvas\` 和 \`com.android.launcher\`，授权 Root 后重启这两个进程。" \
              "" \
              "本发布包由 main 的该次提交自动构建，并通过布局回归与发布证书校验。本版使用开发签名。仓库未包含签名私钥。"
          } > "$notes"

          gh release create "$tag" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "$title" \
            --notes-file "$notes" \
            "${release_args[@]}" \
            "$stage/windowdeck-v${version}.apk" \
            "$stage/SHA256SUMS"
